name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate public Firebase web configuration
        shell: bash
        env:
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
        run: |
          missing=()
          for name in \
            FIREBASE_WEB_API_KEY \
            FIREBASE_WEB_APP_ID \
            FIREBASE_WEB_MESSAGING_SENDER_ID \
            FIREBASE_WEB_PROJECT_ID \
            FIREBASE_WEB_AUTH_DOMAIN; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "Missing GitHub repository variables: ${missing[*]}" >&2
            exit 1
          fi

      - name: Build Flutter web app
        shell: bash
        env:
          APP_ENV: ${{ vars.APP_ENV || 'stage' }}
          FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ vars.FIREBASE_WEB_APP_ID }}
          FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_WEB_MESSAGING_SENDER_ID }}
          FIREBASE_WEB_PROJECT_ID: ${{ vars.FIREBASE_WEB_PROJECT_ID }}
          FIREBASE_WEB_AUTH_DOMAIN: ${{ vars.FIREBASE_WEB_AUTH_DOMAIN }}
          FIREBASE_WEB_STORAGE_BUCKET: ${{ vars.FIREBASE_WEB_STORAGE_BUCKET }}
          FIREBASE_WEB_MEASUREMENT_ID: ${{ vars.FIREBASE_WEB_MEASUREMENT_ID }}
          FIREBASE_APP_CHECK_WEB_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_WEB_SITE_KEY }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base_href="${BASE_PATH}/"
          flutter build web --release \
            --base-href "$base_href" \
            --dart-define="APP_ENV=${APP_ENV}" \
            --dart-define=SPARK_DEMO=true \
            --dart-define="FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}" \
            --dart-define="FIREBASE_WEB_APP_ID=${FIREBASE_WEB_APP_ID}" \
            --dart-define="FIREBASE_WEB_MESSAGING_SENDER_ID=${FIREBASE_WEB_MESSAGING_SENDER_ID}" \
            --dart-define="FIREBASE_WEB_PROJECT_ID=${FIREBASE_WEB_PROJECT_ID}" \
            --dart-define="FIREBASE_WEB_AUTH_DOMAIN=${FIREBASE_WEB_AUTH_DOMAIN}" \
            --dart-define="FIREBASE_WEB_STORAGE_BUCKET=${FIREBASE_WEB_STORAGE_BUCKET}" \
            --dart-define="FIREBASE_WEB_MEASUREMENT_ID=${FIREBASE_WEB_MEASUREMENT_ID}" \
            --dart-define="FIREBASE_APP_CHECK_WEB_SITE_KEY=${FIREBASE_APP_CHECK_WEB_SITE_KEY}"
          sed "s|\$FLUTTER_BASE_HREF|${base_href}|g" web/404.html > build/web/404.html
          touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
